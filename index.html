<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рулетка Призов</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #1c252e; color: white; font-family: Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        .wheel-box { position: relative; width: 320px; height: 320px; transition: transform 0.3s ease; }
        canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 30px rgba(0,0,0,0.6); }
        .pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 25px solid #ff3b30; z-index: 10; transition: transform 0.05s ease; transform-origin: top center;
        }
        .btn {
            margin-top: 35px; background: linear-gradient(135deg, #248bed 0%, #1a72ca 100%); border: none;
            padding: 16px 45px; color: white; border-radius: 14px; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 6px 20px rgba(36,139,237,0.4); animation: pulse 2s infinite ease-in-out;
        }
        .btn:disabled { background: #444; box-shadow: none; animation: none; cursor: not-allowed; opacity: 0.6; }
        #error-msg { color: #ff3b30; margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="wheel-box" id="wheel-wrapper">
        <div class="pointer" id="wheel-pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>
    
    <button class="btn" id="spin-btn" onclick="startSpinSequence()">Испытать удачу</button>
    <div id="error-msg"></div>

    <script>
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) { tg.expand(); }

        // =====================================================================
        # СЮДА ВСТАВЬ ССЫЛКУ НА ТВОЙ СЕРВЕР (ИЗ ТУННЕЛЯ CLOUDFLARED, ПОРТ 8000)
        // =====================================================================
        const API_URL = "https://ТВОЙ_РАБОЧИЙ_://trycloudflare.com";

        const prizes = [
            {"id": 1, "name": "Зеленое яблоко", "emoji": "🍏"}, {"id": 2, "name": "Мандарин", "emoji": "🍊"},
            {"id": 3, "name": "Лимон", "emoji": "🍋"}, {"id": 4, "name": "Банан", "emoji": "🍌"},
            {"id": 5, "name": "Виноград", "emoji": "🍇"}, {"id": 6, "name": "Вишня", "emoji": "🍒"},
            {"id": 7, "name": "Клубника", "emoji": "🍓"}, {"id": 8, "name": "Арбуз", "emoji": "🍉"},
            {"id": 9, "name": "Персик", "emoji": "🍑"}, {"id": 10, "name": "Киви", "emoji": "🥝"}
        ];

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const numSectors = prizes.length;
        const arc = 2 * Math.PI / numSectors;
        let startAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            ctx.clearRect(0, 0, 500, 500);
            const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#4cd964', '#5ac8fa', '#007aff', '#5856d6', '#b83af3', '#e91e63', '#009688'];
            for (let i = 0; i < numSectors; i++) {
                const angle = startAngle + i * arc;
                let gradient = ctx.createRadialGradient(250, 250, 50, 250, 250, 250);
                gradient.addColorStop(0, '#2c3e50'); gradient.addColorStop(1, colors[i % colors.length]);
                ctx.fillStyle = gradient; ctx.beginPath(); ctx.moveTo(250, 250);
                ctx.arc(250, 250, 250, angle, angle + arc); ctx.lineTo(250, 250); ctx.fill();
                ctx.save(); ctx.translate(250, 250); ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right"; ctx.font = "36px Arial"; ctx.fillStyle = "#fff";
                ctx.fillText(prizes[i].emoji, 210, 12); ctx.restore();
            }
        }
        drawWheel();

        // Моментальный скрытый запрос к серверу при клике
        function startSpinSequence() {
            if (isSpinning) return;
            document.getElementById('error-msg').innerText = "";

            // Получаем ID юзера из Телеграма
            const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : 12345;

            // Стучимся на бэкэнд к Питон-скрипту
            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Сервер вернул приз! Запускаем кручение
                    animateWheel(data.win_id);
                } else {
                    // Выводим ошибку (например "Недостаточно средств") на экран
                    document.getElementById('error-msg').innerText = data.error;
                }
            })
            .catch(() => {
                document.getElementById('error-msg').innerText = "Ошибка связи с сервером бота!";
            });
        }

        function animateWheel(winId) {
            isSpinning = true;
            const btn = document.getElementById('spin-btn');
            const pointer = document.getElementById('wheel-pointer');
            const wrapper = document.getElementById('wheel-wrapper');
            btn.disabled = true;

            const targetSector = prizes.findIndex(p => p.id === winId);
            const spinAngle = (360 * 7) + (360 - (targetSector * (360 / numSectors))) - (360 / numSectors / 2); 
            const spinRad = spinAngle * Math.PI / 180;
            const duration = 5000; 
            const start = performance.now();
            let lastSectorIndex = -1;

            function animate(time) {
                let progress = (time - start) / duration;
                if (progress > 1) progress = 1;

                startAngle = (1 - Math.pow(1 - progress, 5)) * spinRad;
                drawWheel();

                const currentDegrees = (startAngle * 180 / Math.PI) % 360;
                const currentSectorIndex = Math.floor((360 - currentDegrees + 270) % 360 / (360 / numSectors)) % numSectors;
                if (currentSectorIndex !== lastSectorIndex && progress < 0.95) {
                    lastSectorIndex = currentSectorIndex;
                    pointer.style.transform = "translateX(-50%) rotate(-15deg)";
                    setTimeout(() => { pointer.style.transform = "translateX(-50%) rotate(0deg)"; }, 40);
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    pointer.style.transform = "translateX(-50%) scale(1.2)";
                    setTimeout(() => {
                        if (tg) { tg.close(); }
                    }, 400);
                }
            }
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
