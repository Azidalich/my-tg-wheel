<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рулетка Призов</title>
    <!-- ПОДКЛЮЧАЕМ СКИПТ ТЕЛЕГРАМА -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #1c252e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .wheel-box {
            position: relative;
            width: 320px;
            height: 320px;
            transition: transform 0.3s ease;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.6), 0 0 10px rgba(36,139,237,0.2);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff3b30;
            z-index: 10;
            /* Плавный возврат стрелочки при щелчке */
            transition: transform 0.05s ease; 
            transform-origin: top center;
        }
        .btn {
            margin-top: 35px;
            background: linear-gradient(135deg, #248bed 0%, #1a72ca 100%);
            border: none;
            padding: 16px 45px;
            color: white;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(36,139,237,0.4);
            /* Плавная бесконечная пульсация кнопки */
            animation: pulse 2s infinite ease-in-out;
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:disabled {
            background: #444;
            box-shadow: none;
            animation: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 6px 20px rgba(36,139,237,0.4); }
            50% { transform: scale(1.04); box-shadow: 0 10px 25px rgba(36,139,237,0.6); }
            100% { transform: scale(1); box-shadow: 0 6px 20px rgba(36,139,237,0.4); }
        }
    </style>
</head>
<body>

    <div class="wheel-box" id="wheel-wrapper">
        <div class="pointer" id="wheel-pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>
    
    <button class="btn" id="spin-btn" onclick="spin()">Испытать удачу</button>

    <script>
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        
        if (tg) {
            tg.expand();
        }

        const prizes = [
            {"id": 1, "name": "Зеленое яблоко", "emoji": "🍏"},
            {"id": 2, "name": "Мандарин", "emoji": "🍊"},
            {"id": 3, "name": "Лимон", "emoji": "🍋"},
            {"id": 4, "name": "Банан", "emoji": "🍌"},
            {"id": 5, "name": "Виноград", "emoji": "🍇"},
            {"id": 6, "name": "Вишня", "emoji": "🍒"},
            {"id": 7, "name": "Клубника", "emoji": "🍓"},
            {"id": 8, "name": "Арбуз", "emoji": "🍉"},
            {"id": 9, "name": "Персик", "emoji": "🍑"},
            {"id": 10, "name": "Киви", "emoji": "🥝"}
        ];

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const numSectors = prizes.length;
        const arc = 2 * Math.PI / numSectors;
        let startAngle = 0;
        let isSpinning = false;

        // Эффект красивого градиента на секторах колеса
        function drawWheel() {
            ctx.clearRect(0, 0, 500, 500);
            const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#4cd964', '#5ac8fa', '#007aff', '#5856d6', '#b83af3', '#e91e63', '#009688'];
            
            for (let i = 0; i < numSectors; i++) {
                const angle = startAngle + i * arc;
                
                // Создаем легкий радиальный градиент для объема
                let gradient = ctx.createRadialGradient(250, 250, 50, 250, 250, 250);
                gradient.addColorStop(0, '#2c3e50');
                gradient.addColorStop(1, colors[i % colors.length]);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 250, angle, angle + arc);
                ctx.lineTo(250, 250);
                ctx.fill();

                // Обводка секторов стильной тонкой линией
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Отрисовка эмодзи (увеличили разрешение до 500px, текст теперь четче)
                ctx.save();
                ctx.translate(250, 250);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.font = "36px Arial";
                ctx.fillStyle = "#fff";
                ctx.fillText(prizes[i].emoji, 210, 12);
                ctx.restore();
            }

            // Рисуем стильную центральную заглушку
            ctx.beginPath();
            ctx.arc(250, 250, 25, 0, 2 * Math.PI);
            ctx.fillStyle = '#1c252e';
            ctx.fill();
            ctx.strokeStyle = '#248bed';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        drawWheel();

        // КИНЕМАТОГРАФИЧЕСКАЯ ФУНКЦИЯ ЗАМЕДЛЕНИЯ (EaseOutQuint)
        // Дает мощный старт и очень-очень плавное скольжение в конце
        function easeOutQuint(x) {
            return 1 - Math.pow(1 - x, 5);
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            
            const btn = document.getElementById('spin-btn');
            const pointer = document.getElementById('wheel-pointer');
            const wrapper = document.getElementById('wheel-wrapper');
            
            btn.disabled = true;
            // Легкий визуальный толчок самого колеса при старте
            wrapper.style.transform = "scale(0.97)";

            const urlParams = new URLSearchParams(window.location.search);
            const winId = parseInt(urlParams.get('win')) || 1; 
            const targetSector = prizes.findIndex(p => p.id === winId);

            // Колесо делает 7 полных оборотов для пущей эпичности
            const extraRotations = 7; 
            const targetAngle = (360 * extraRotations) + (360 - (targetSector * (360 / numSectors))) - (360 / numSectors / 2); 
            const spinRad = targetAngle * Math.PI / 180;
            
            const duration = 5000; // Увеличили время до 5 секунд для кайфового долгого скольжения
            const start = performance.now();
            
            let lastSectorIndex = -1;

            function animate(time) {
                let progress = (time - start) / duration;
                if (progress > 1) progress = 1;

                const ease = easeOutQuint(progress);
                startAngle = ease * spinRad;
                drawWheel();

                if (progress < 0.1) {
                    wrapper.style.transform = "scale(1.02)";
                }

                // ЭФФЕКТ ЩЕЛЧКА СТРЕЛОЧКИ (Каждый раз, когда стрелка пересекает сектор)
                // Рассчитываем текущий сектор под стрелкой (вверху, это угол -Math.PI/2)
                const currentDegrees = (startAngle * 180 / Math.PI) % 360;
                const currentSectorIndex = Math.floor((360 - currentDegrees + 270) % 360 / (360 / numSectors)) % numSectors;
                
                if (currentSectorIndex !== lastSectorIndex && progress < 0.95) {
                    lastSectorIndex = currentSectorIndex;
                    // Слегка отклоняем стрелочку влево/вправо имитируя удар об зубчик секторов
                    pointer.style.transform = "translateX(-50%) rotate(-15deg)";
                    setTimeout(() => {
                        pointer.style.transform = "translateX(-50%) rotate(0deg)";
                    }, 40);
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    wrapper.style.transform = "scale(1)";
                    
                    // Финальный победный "тык" стрелочки
                    pointer.style.transform = "translateX(-50%) scale(1.2)";
                    setTimeout(() => pointer.style.transform = "translateX(-50%) scale(1)", 200);

                    if (tg) {
                        setTimeout(() => { tg.close(); }, 300); 
                    } else {
                        alert("Тест! Выпал приз: " + prizes[targetSector].emoji + " " + prizes[targetSector].name);
                        btn.disabled = false;
                    }
                }
            }
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
